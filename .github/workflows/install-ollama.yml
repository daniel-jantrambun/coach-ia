name: Install Ollama on Synology

# À lancer à la main : au premier déploiement, puis pour changer de version d'Ollama ou de modèle.
# Le NAS n'accède pas aux registres : le runner télécharge l'image et le modèle, puis les transfère.
on:
    workflow_dispatch:
        inputs:
            model:
                description:
                    Modèle Ollama à installer (doit correspondre à
                    COACH_LLM_MODEL dans le .env du NAS)
                default: qwen2.5:3b
                required: true

permissions:
    contents: read

env:
    NAS_PLATFORM: linux/amd64
    NAS_DIR: /volume1/docker/savapav
    # Transit des fichiers envoyés au NAS (le préfixe @ le masque dans File Station).
    STAGE: /volume1/@savapav-incoming

jobs:
    install:
        runs-on: ubuntu-latest
        # ~5,7 Go à transférer par WireGuard puis `docker load` sur le J4125 : c'est long, mais pas illimité.
        timeout-minutes: 20
        concurrency: deploy-nas
        steps:
            - uses: actions/checkout@v4

            # La version d'Ollama vient du compose.yaml : une seule source de vérité.
            # - name: Download Ollama image and model
            #   timeout-minutes: 20
            #   run: |
            #       OLLAMA_IMAGE=$(grep -o 'ollama/ollama:[^ "]*' compose.yaml)
            #       echo "OLLAMA_IMAGE=$OLLAMA_IMAGE" >> "$GITHUB_ENV"
            #       docker pull --platform "$NAS_PLATFORM" "$OLLAMA_IMAGE"
            #       docker save --platform "$NAS_PLATFORM" "$OLLAMA_IMAGE" | gzip > ollama-image.tar.gz

            #       mkdir ollama-data
            #       docker run -d --name ollama -v "$PWD/ollama-data:/root/.ollama" "$OLLAMA_IMAGE"
            #       sleep 5
            #       docker exec ollama ollama pull "${{ inputs.model }}"
            #       docker rm -f ollama
            #       # Les poids GGUF sont déjà compressés : un tar simple suffit.
            #       sudo tar -C ollama-data -cf ollama-models.tar models
            #       ls -lh ollama-image.tar.gz ollama-models.tar

            - name: Connect WireGuard
              timeout-minutes: 3
              run: |
                  sudo apt-get update && sudo apt-get install -y wireguard-tools resolvconf sshpass
                  echo "${{ secrets.WG_CONFIG }}" | sudo tee /etc/wireguard/wg0.conf > /dev/null
                  sudo chmod 600 /etc/wireguard/wg0.conf
                  sudo wg-quick up wg0

            - name: Install on Synology
              timeout-minutes: 60
              env:
                  SSHPASS: ${{ secrets.SYNOLOGY_USER_PWD }}
                  TARGET:
                      ${{ vars.SYNOLOGY_USER_LOGIN }}@${{
                      vars.SYNOLOGY_PRIVATE_IP }}
                  NAS_USER: ${{ vars.SYNOLOGY_USER_LOGIN }}
              run: |
                  nas() { sshpass -e ssh -p 22822 -o StrictHostKeyChecking=no "$TARGET" "$@"; }
                  [ "$(nas uname -m)" = x86_64 ] || { echo "Le NAS n'est plus en x86_64 : adapter NAS_PLATFORM" >&2; exit 1; }

                  echo "Transfert de l'image et du modèle Ollama vers le NAS ($TARGET)..."
                  # /tmp est sur la partition système de DSM (~2 Go) : on transite par un dossier du volume, hors des
                  # dossiers partagés (leurs ACL Synology empêchent ci-github d'y écrire, même après chown).
                  echo "$SSHPASS" | nas "sudo -S -p '' sh -euc 'mkdir -p $STAGE && chown $NAS_USER $STAGE && chmod 700 $STAGE'"
                  nas "test -w $STAGE" || { echo "$NAS_USER ne peut pas écrire dans $STAGE" >&2; exit 1; }
                  nas "cat > $STAGE/ollama-image.tar.gz" < ollama-image.tar.gz
                  nas "cat > $STAGE/ollama-models.tar" < ollama-models.tar
                  echo "Transfert terminé : $(nas ls -lh $STAGE/ollama-image.tar.gz $STAGE/ollama-models.tar)"

                  echo "Installation de l'image et du modèle Ollama sur le NAS ($TARGET)..."

                  # Les modèles déjà présents sont conservés ; le nouveau s'ajoute à côté.
                  echo "$SSHPASS" | nas "sudo -S -p '' sh -euc '
                    /usr/local/bin/docker load -i $STAGE/ollama-image.tar.gz
                    mkdir -p $NAS_DIR/ollama
                    tar -C $NAS_DIR/ollama -xf $STAGE/ollama-models.tar
                    rm -f $STAGE/ollama-image.tar.gz $STAGE/ollama-models.tar
                    if [ -f $NAS_DIR/compose.yaml ]; then
                      cd $NAS_DIR && /usr/local/bin/docker compose up -d llm && sleep 3
                      /usr/local/bin/docker compose exec -T llm ollama list
                    fi'"

            - name: Disconnect
              if: always()
              timeout-minutes: 2
              run: sudo wg-quick down wg0
