[project]
name = "coach-ia"
version = "0.1.0"
description = "Planificateur d'entraînement personnel : données Garmin/Strava → charge d'entraînement → plan déterministe, rédigé par un LLM 3B local."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "fitdecode>=0.10",
    "garminconnect>=0.3.5",  # < 0.3.5 : CVE-2026-54447 ; < 0.3 : ancienne connexion garth, cassée
    "cryptography>=43",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
coach = "coach.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E731"]
