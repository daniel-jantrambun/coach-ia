# Déploiement sur le DS720+ (Container Manager) : /volume1/coach-ia/compose.yaml
services:
  app:
    image: ghcr.io/daniel-jantrambun/coach-ia:latest
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      COACH_LLM_BASE_URL: http://llm:11434
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
    depends_on:
      - llm

  # LLM 3B local. Le modèle est déchargé de la RAM après 5 min d'inactivité.
  # À la première installation : docker compose exec llm ollama pull qwen2.5:3b
  llm:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ./ollama:/root/.ollama
    mem_limit: 3g
